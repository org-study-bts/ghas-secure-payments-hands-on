name: Start GHAS exercise

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-exercise-scaffold:
    name: Verify exercise scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Check Skills structure
        shell: bash
        run: |
          test -f README.md
          test -f pom.xml
          test -f .devcontainer/devcontainer.json
          test -f .github/steps/1-baseline.md
          test -f .github/steps/2-code-scanning.md
          test -f .github/steps/3-dependencies.md
          test -f .github/steps/4-triage-and-validation.md
          echo "Scaffold pronto. Continue pela Fase 1."
