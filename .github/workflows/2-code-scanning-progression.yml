name: Step 2 - code scanning

on:
  push:
    branches: [ghas-baseline]
    paths:
      - src/main/java/com/example/securepayments/training/UnsafeCodeqlDemo.java

permissions:
  contents: read

env:
  TOOLKIT_REF: 591d7ca109412b3ff9c70b15a31377031e11e4c4

jobs:
  find-exercise:
    if: "github.event.head_commit.message == 'fix: remove CodeQL unsafe fixture'"
    permissions:
      contents: read
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@591d7ca109412b3ff9c70b15a31377031e11e4c4

  check-codeql-correction:
    if: "github.event.head_commit.message == 'fix: remove CodeQL unsafe fixture'"
    needs: find-exercise
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: temurin
      - name: Require safe fixture removal and regression test
        run: |
          test "$(git log -1 --pretty=%s)" = "fix: remove CodeQL unsafe fixture"
          test ! -f src/main/java/com/example/securepayments/training/UnsafeCodeqlDemo.java
          test -f src/test/java/com/example/securepayments/CodeqlCorrectionTests.java
          ./mvnw --batch-mode --no-transfer-progress test

  publish-next-step:
    if: "github.event.head_commit.message == 'fix: remove CodeQL unsafe fixture'"
    needs: [find-exercise, check-codeql-correction]
    permissions:
      contents: read
      actions: write
      issues: write
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find-exercise.outputs.issue-number }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/checkout@v4.2.2
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: ${{ env.TOOLKIT_REF }}
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/3-dependencies.md
      - run: gh workflow disable "${{ github.workflow }}" && gh workflow enable "Step 3 - dependencies"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
