name: Phase 2 - code scanning
on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: github/codeql-action/init@v3.28.17
        with: { languages: java, config-file: ./.github/codeql/codeql-config.yml }
      - uses: github/codeql-action/autobuild@v3.28.17
      - uses: github/codeql-action/analyze@v3.28.17
        with: { category: /language:java }
