name: Step 3 - dependencies

on:
  push:
    branches: [ghas-baseline]
    paths:
      - pom.xml

permissions:
  contents: read
  actions: write
  issues: write

env:
  TOOLKIT_REF: 2bed354b84a2633bc05cb5d6c8658bfa47345445

jobs:
  find-exercise:
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@2bed354b84a2633bc05cb5d6c8658bfa47345445

  check-dependency-update:
    needs: find-exercise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: temurin
      - name: Require dependency update and tests
        run: |
          test "$(git log -1 --pretty=%s)" = "fix: update vulnerable dependency"
          ! grep -q '<version>1.9</version>' pom.xml
          grep -q 'commons-text' pom.xml
          ./mvnw --batch-mode --no-transfer-progress test

  publish-next-step:
    needs: [find-exercise, check-dependency-update]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find-exercise.outputs.issue-number }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/checkout@v4.2.2
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: ${{ env.TOOLKIT_REF }}
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 4
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/4-triage-and-validation.md
      - run: gh workflow disable "${{ github.workflow }}" && gh workflow enable "Step 4 - triage and validation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
