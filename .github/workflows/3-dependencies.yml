name: Phase 3 - dependency review
on:
  pull_request:
  push:
permissions:
  contents: read
  pull-requests: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
