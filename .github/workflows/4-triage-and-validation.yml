name: Phase 4 - triage and validation
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with: { java-version: '17', distribution: temurin, cache: maven }
      - run: mvn --batch-mode --no-transfer-progress test
      - name: Validate required exercise files
        shell: bash
        run: |
          test -f README.md && test -f SECURITY.md && test -f INSTRUCTOR-GUIDE.md
          test -f .github/codeql/codeql-config.yml
          for f in .github/steps/1-baseline.md .github/steps/2-code-scanning.md .github/steps/3-dependencies.md .github/steps/4-triage-and-validation.md; do test -f "$f"; done
